    Projects:
      - name: EBA_01, Vision-Guided Robotic Arm
        summary: Independent project, ongoing.
        highlights:
          - "Built the perception pipeline for an ESP32-CAM video stream: ChArUco camera calibration, ArUco marker detection and pose estimation, and an affine pixel-to-table mapping from three reference markers."
          - Derived and implemented inverse kinematics in C++ for a 3-DOF arm with a gripper on an ESP32-C3, decoupled into base rotation plus a 2-link planar solve, and fed it the vision output through a Wi-Fi HTTP endpoint.
          - Fabricated and assembled 3D-printed parts; handled hardware integration, servo debugging and firmware setup (PlatformIO).
          - Trained CNN image classifiers in Keras 3 with a PyTorch backend.
          - "Stack: Python, OpenCV, C++, ESP32-CAM, ESP32-C3, Arduino, PlatformIO."

      - name: Quadrotor GNC in ROS 2, Custom EKF and Trajectory-Tracking Controller
        summary: Independent project, in progress (started Nov 2026).
        highlights:
          - Building a ROS 2 (Humble) stack that flies a simulated quadrotor in PX4 SITL / Gazebo through offboard control.
          - Implementing a cascaded PID position controller for trajectory tracking, with an LQR controller planned for comparison.
          - Implementing an Extended Kalman Filter that fuses IMU data with GPS and AprilTag-based visual pose, evaluated against ground truth, including GPS-dropout scenarios.
          - "Stack: ROS 2, PX4, Gazebo, Python / C++."

